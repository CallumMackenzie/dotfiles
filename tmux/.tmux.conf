# Allow applications such as image.nvim to pass graphics escape sequences
# through tmux to a compatible terminal (for example Ghostty or Kitty).
set -g allow-passthrough on

# Keep image.nvim rendering synchronized when tmux focus changes.
set -g visual-activity off
set-option -g focus-events on

# Advertise tmux's full 256-colour terminal capabilities to applications.
set -g default-terminal "tmux-256color"

# Pi's editor needs modified Enter and other extended key sequences.
set -g extended-keys on
set -g extended-keys-format csi-u

# Use Vim-style navigation in copy mode (enter with Prefix + [).
setw -g mode-keys vi

# Keep a tmux-native inbox for agent completion notifications and allow
# prefix + N to jump to the next pane that needs attention.
# BEGIN tmux-notify-jump
set -g @tmux-notify-jump-key N
run-shell -b "$HOME/.local/bin/tmux-notify-jump --tmux-init"
# END tmux-notify-jump
